<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世紀難題——吃什麼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700;900&family=Ma+Shan+Zheng&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f0c060;
    --gold-dim: #a07830;
    --teal: #40e0c0;
    --pink: #ff60a0;
    --purple: #9060e0;
    --bg-deep: #050810;
    --bg-mid: #0a1020;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text-main: #e8e0ff;
    --text-dim: #8880aa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Noto Serif TC', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Starfield ── */
  #stars-canvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  /* ── Header ── */
  header {
    position: relative; z-index: 10;
    text-align: center;
    padding: 60px 20px 30px;
  }
  header .en-sub {
    font-family: 'Cinzel Decorative', serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  header h1 {
    font-family: 'Ma Shan Zheng', serif;
    font-size: clamp(36px, 8vw, 80px);
    background: linear-gradient(135deg, var(--gold) 0%, #fff8e0 40%, var(--teal) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    text-shadow: none;
    letter-spacing: 4px;
  }
  header p.tagline {
    margin-top: 14px;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 3px;
  }

  /* ── Date badge ── */
  .date-badge {
    display: inline-block;
    margin: 10px auto 0;
    padding: 4px 18px;
    border: 1px solid var(--gold-dim);
    border-radius: 20px;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 2px;
  }

  /* ── Result Panel ── */
  #result-panel {
    display: none;
    position: relative; z-index: 10;
    max-width: 700px;
    margin: 0 auto 40px;
    padding: 0 20px;
  }
  .result-card {
    background: linear-gradient(135deg, rgba(240,192,96,0.08), rgba(64,224,192,0.06));
    border: 1px solid rgba(240,192,96,0.3);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
  }
  .result-card .result-method {
    font-size: 11px; letter-spacing: 4px; color: var(--gold); margin-bottom: 8px;
  }
  .result-card .result-title {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 22px; color: #fff; margin-bottom: 20px;
  }
  .meals-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .meal-item {
    background: rgba(255,255,255,0.05);
    border-radius: 12px; padding: 14px 10px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .meal-label {
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 6px;
  }
  .meal-name {
    font-size: 18px; color: var(--gold);
    font-family: 'Ma Shan Zheng', serif;
  }
  .result-note {
    font-size: 13px; color: var(--text-dim); line-height: 1.8;
    font-style: italic;
  }

  /* ── Methods Grid ── */
  .section-label {
    position: relative; z-index: 10;
    text-align: center;
    font-size: 11px; letter-spacing: 5px; color: var(--text-dim);
    margin-bottom: 24px;
  }
  .methods-grid {
    position: relative; z-index: 10;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .method-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 22px 14px 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
  }
  .method-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--accent-color, rgba(240,192,96,0.15)), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .method-card:hover:not(.used) {
    transform: translateY(-4px) scale(1.03);
    border-color: var(--accent-color, var(--gold));
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .method-card:hover:not(.used)::before { opacity: 1; }
  .method-card.used {
    opacity: 0.75; cursor: pointer;
    border-color: rgba(240,192,96,0.2);
  }
  .method-card .icon {
    font-size: 36px; margin-bottom: 10px;
    display: block;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
  }
  .method-card .method-name {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 16px; color: #fff; margin-bottom: 4px;
  }
  .method-card .method-desc {
    font-size: 10px; color: var(--text-dim); letter-spacing: 1px; line-height: 1.5;
  }
  .method-card .badge-daily {
    position: absolute; top: 10px; right: 10px;
    background: rgba(144,96,224,0.3);
    border: 1px solid rgba(144,96,224,0.5);
    border-radius: 6px;
    font-size: 9px; padding: 2px 6px; color: #c0a0ff;
    letter-spacing: 1px;
  }
  .method-card .badge-used {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    font-size: 9px; padding: 2px 6px; color: var(--text-dim);
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,8,16,0.92);
    backdrop-filter: blur(8px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: linear-gradient(160deg, #0d1530, #08101e);
    border: 1px solid rgba(240,192,96,0.2);
    border-radius: 24px;
    padding: 40px;
    max-width: 480px; width: 90%;
    position: relative;
    animation: modalIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes modalIn {
    from { transform: scale(0.8) translateY(30px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal-close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none; color: var(--text-dim);
    font-size: 24px; cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: #fff; }
  .modal h2 {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 26px; margin-bottom: 6px; color: var(--gold);
    text-align: center;
  }
  .modal .modal-sub {
    text-align: center; font-size: 12px; color: var(--text-dim);
    margin-bottom: 28px; letter-spacing: 2px;
  }
  /* Modal content areas */
  .modal-body { min-height: 180px; }

  /* Zodiac / Shengxiao / MBTI selectors */
  .select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px,1fr));
    gap: 8px; margin-bottom: 20px;
  }
  .select-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 4px;
    color: var(--text-main);
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Serif TC', serif;
    transition: all 0.2s;
    text-align: center;
  }
  .select-btn:hover, .select-btn.active {
    background: rgba(240,192,96,0.15);
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Dice */
  #dice-display {
    text-align: center; padding: 20px 0;
  }
  #dice-face {
    font-size: 90px; display: block;
    transition: transform 0.1s;
    filter: drop-shadow(0 0 20px rgba(240,192,96,0.4));
  }
  #dice-display p { color: var(--text-dim); font-size: 13px; margin-top: 10px; }

  /* Wheel */
  #wheel-wrap { text-align: center; }
  #wheel-canvas { border-radius: 50%; margin: 0 auto; display: block; }
  #wheel-pointer {
    font-size: 32px; line-height: 1;
    margin: -16px auto 10px;
    filter: drop-shadow(0 0 6px rgba(255,96,160,0.6));
  }

  /* Tarot */
  .tarot-cards {
    display: flex; gap: 12px; justify-content: center;
    margin-bottom: 16px;
  }
  .tarot-card {
    width: 70px; height: 110px;
    background: linear-gradient(135deg, #1a0a30, #0d1540);
    border: 2px solid rgba(144,96,224,0.4);
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    transition: all 0.3s;
    position: relative; overflow: hidden;
  }
  .tarot-card::before {
    content: '✦';
    position: absolute; font-size: 60px;
    color: rgba(144,96,224,0.1);
  }
  .tarot-card:hover { transform: translateY(-8px); border-color: var(--purple); }
  .tarot-card.flipped {
    background: linear-gradient(135deg, #2a1050, #1a2060);
    border-color: var(--gold);
    pointer-events: none;
  }
  #tarot-hint { text-align: center; font-size: 12px; color: var(--text-dim); }

  /* Fortune sticks */
  #sticks-wrap { text-align: center; padding: 10px 0; }
  #stick-container {
    font-size: 60px; margin: 10px auto;
    filter: drop-shadow(0 0 12px rgba(240,192,96,0.3));
    cursor: pointer;
    display: inline-block;
    transition: transform 0.15s;
    user-select: none;
  }
  #stick-container:active { transform: rotate(-5deg) scale(0.95); }
  #stick-result { font-family: 'Ma Shan Zheng',serif; font-size: 18px; color: var(--gold); margin: 10px 0; min-height: 28px; }

  /* Pendulum */
  #pendulum-wrap { text-align: center; }
  #pendulum-svg { display: block; margin: 0 auto; }
  #pendulum-question { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }

  /* Crystal ball */
  #crystal-wrap { text-align: center; }
  #crystal-ball {
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), rgba(64,224,192,0.1) 40%, rgba(144,96,224,0.05));
    border: 2px solid rgba(64,224,192,0.3);
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: rgba(64,224,192,0.6);
    cursor: pointer;
    box-shadow: 0 0 40px rgba(64,224,192,0.15), inset 0 0 30px rgba(144,96,224,0.1);
    transition: all 0.4s;
    font-family: 'Ma Shan Zheng', serif;
    user-select: none;
  }
  #crystal-ball:hover { box-shadow: 0 0 60px rgba(64,224,192,0.3), inset 0 0 40px rgba(144,96,224,0.2); }

  /* Submit btn */
  .modal-submit {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, rgba(240,192,96,0.2), rgba(64,224,192,0.15));
    border: 1px solid rgba(240,192,96,0.4);
    border-radius: 12px;
    color: var(--gold);
    font-family: 'Ma Shan Zheng', serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
  }
  .modal-submit:hover {
    background: linear-gradient(135deg, rgba(240,192,96,0.3), rgba(64,224,192,0.25));
    box-shadow: 0 0 20px rgba(240,192,96,0.2);
    transform: translateY(-2px);
  }
  .modal-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Loading animation */
  @keyframes reveal { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .animate-in { animation: reveal 0.6s ease forwards; }

  /* Divider */
  .mystic-divider {
    position: relative; z-index: 10;
    text-align: center;
    color: var(--gold-dim);
    letter-spacing: 8px;
    font-size: 12px;
    margin: 40px 0 28px;
  }

  /* Footer */
  footer {
    position: relative; z-index: 10;
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 2px;
  }

  /* Reset btn */
  .reset-btn {
    display: block;
    margin: 0 auto 20px;
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px 18px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  .reset-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

  /* Glow pulse */
  @keyframes glow-pulse {
    0%,100% { text-shadow: 0 0 10px rgba(240,192,96,0.3); }
    50% { text-shadow: 0 0 25px rgba(240,192,96,0.7), 0 0 50px rgba(240,192,96,0.3); }
  }
  header h1 { animation: none; }

  /* Orbiting dots */
  .orbit-ring {
    position: fixed; top: 50%; left: 50%;
    width: 600px; height: 600px;
    margin: -300px 0 0 -300px;
    border-radius: 50%;
    border: 1px solid rgba(240,192,96,0.03);
    animation: orbit 60s linear infinite;
    z-index: 1; pointer-events: none;
  }
  @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .shake {
    animation: shake 0.5s;
  }
  @keyframes shake {
    0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}
  }
</style>
</head>

<canvas id="stars-canvas"></canvas>
<div class="orbit-ring"></div>

<header>

  <h1>今天——吃什麼</h1>

</header>

<!-- Result Panel -->
<div id="result-panel">

    <div class="result-note" id="result-note">天機不可洩漏太多……</div>

</div>

<div class="mystic-divider">✦ 選擇你的占卜方式 ✦</div>

<div class="methods-grid" id="methods-grid"></div>

</div>

<footer>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">

    <div class="modal-body" id="modal-body"></div>
    <button class="modal-submit" id="modal-submit" onclick="submitModal()">✦ 啟示命運 ✦</button>
  </div>
</div>

function pickMeals(seed) {
  function seededRand(s) {
    let x = Math.sin(s) * 10000;
    return x - Math.floor(x);
  }
  const r1 = Math.floor(seededRand(seed * 7 + 1) * FOODS.breakfast.length);
  const r2 = Math.floor(seededRand(seed * 13 + 3) * FOODS.lunch.length);
  const r3 = Math.floor(seededRand(seed * 17 + 7) * FOODS.dinner.length);
  return {
    breakfast: FOODS.breakfast[r1],
    lunch: FOODS.lunch[r2],
    dinner: FOODS.dinner[r3]
  };
}

(function() {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = innerWidth; canvas.height = innerHeight;
    stars = Array.from({length: 200}, () => ({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3, a: Math.random(), da: (Math.random()-0.5)*0.005,
    }));
  }
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s => {
      s.a = Math.max(0.1, Math.min(1, s.a + s.da));
      if (s.a <= 0.1 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,240,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); draw();
  window.addEventListener('resize', resize);
})();

// WHEEL MODAL
// ─────────────────────────────────────────────
const WHEEL_ITEMS = ['清淡系','大肉系','海鮮系','蔬食系','辛辣系','甜食系','湯品系','異國系'];
const WHEEL_COLORS = ['#9060e0','#40e0c0','#ff60a0','#f0c060','#60a0ff','#ff9040','#80e060','#e060c0'];

function renderWheelModal() {
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div id="wheel-wrap">
      <div id="wheel-pointer">▼</div>
      <canvas id="wheel-canvas" width="220" height="220"></canvas>
      <p id="wheel-status" style="color:var(--text-dim);font-size:12px;margin-top:12px;">點擊轉盤開始旋轉</p>
    </div>
  `;
  const canvas = document.getElementById('wheel-canvas');
  const ctx = canvas.getContext('2d');
  let angle = 0; let spinning = false;

  function drawWheel(a) {
    const n = WHEEL_ITEMS.length;
    const slice = (2 * Math.PI) / n;
    const cx = 110, cy = 110, r = 105;
    ctx.clearRect(0,0,220,220);
    for (let i=0;i<n;i++) {
      const start = a + i*slice;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,start+slice);
      ctx.closePath();
      ctx.fillStyle = WHEEL_COLORS[i];
      ctx.fill();
      ctx.strokeStyle = '#050810'; ctx.lineWidth = 2; ctx.stroke();
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(start + slice/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px "Noto Serif TC"';
      ctx.fillText(WHEEL_ITEMS[i], r-8, 5);
      ctx.restore();
    }
    // center
    ctx.beginPath(); ctx.arc(cx,cy,14,0,Math.PI*2);
    ctx.fillStyle = '#050810'; ctx.fill();
    ctx.strokeStyle = 'rgba(240,192,96,0.5)'; ctx.lineWidth=2; ctx.stroke();
  }

  drawWheel(0);

  canvas.onclick = function() {
    if (spinning || modalState.category) return;
    spinning = true;
    document.getElementById('wheel-status').textContent = '命運之輪正在旋轉…';
    const totalRotation = (Math.random()*4+4) * Math.PI * 2;
    const duration = 3000;
    const start = performance.now();
    function animate(now) {
      const t = (now - start) / duration;
      if (t >= 1) {
        angle = totalRotation % (Math.PI*2);
        drawWheel(angle);
        const n = WHEEL_ITEMS.length;
        const slice = (2*Math.PI)/n;
        // pointer at top = 3π/2 from angle perspective, find which segment
        const ptr = (Math.PI*2*2 - angle + Math.PI*3/2) % (Math.PI*2);
        const idx = Math.floor(ptr / slice) % n;
        modalState.category = WHEEL_ITEMS[idx];
        modalState.seed = Math.floor(Math.random()*9999);
        document.getElementById('wheel-status').textContent = `✦ 命運選擇：${WHEEL_ITEMS[idx]} ✦`;
        document.getElementById('modal-submit').disabled = false;
        spinning = false;
        return;
      }
      // ease out
      const eased = 1 - Math.pow(1-t, 3);
      drawWheel(eased * totalRotation);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  };
}

function renderTarotModal() {
  const body = document.getElementById('modal-body');
  // Shuffle cards
  const deck = Array.from({length:22},(_,i)=>i);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  const three = deck.slice(0,3);
  let flipped = 0;

  body.innerHTML = `
    <div class="tarot-cards" id="tarot-cards"></div>
    <div id="tarot-hint">點擊三張牌中的任意一張，讓塔羅為你指路</div>
  `;
  const cardsEl = document.getElementById('tarot-cards');
  three.forEach((cardIdx, i) => {
    const card = document.createElement('div');
    card.className = 'tarot-card';
    card.innerHTML = '✦';
    card.onclick = function() {
      if (card.classList.contains('flipped')) return;
      card.classList.add('flipped');
      card.innerHTML = `<span style="font-size:32px">${TAROT_EMOJI[cardIdx]}</span><span style="font-size:10px;position:absolute;bottom:6px;color:var(--gold)">${TAROT_NAMES[cardIdx]}</span>`;
      flipped++;
      if (flipped === 1) {
        // Use this card for result
        modalState.tarotName = TAROT_NAMES[cardIdx];
        modalState.tarotNote = TAROT_NOTES[TAROT_NAMES[cardIdx]];
        modalState.seed = cardIdx * 17 + Math.floor(Math.random()*100);
        document.getElementById('tarot-hint').textContent = `✦ 你的命牌：${TAROT_NAMES[cardIdx]} ✦`;
        document.getElementById('modal-submit').disabled = false;
      }
    };
    cardsEl.appendChild(card);
  });
}

function renderPendulumModal() {
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div id="pendulum-wrap">
      <p id="pendulum-question" style="color:var(--text-dim);font-size:12px;text-align:center;margin-bottom:8px;">靜心觀察靈擺方向，感應今日食緣</p>
      <svg id="pendulum-svg" width="200" height="160" viewBox="0 0 200 160">
        <line x1="100" y1="10" x2="100" y2="70" stroke="rgba(240,192,96,0.4)" stroke-width="1"/>
        <circle id="pend-ball" cx="100" cy="80" r="14" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text id="pend-symbol" x="100" y="85" text-anchor="middle" fill="var(--gold)" font-size="14" font-family="serif">◈</text>
        <text x="20" y="150" fill="rgba(64,224,192,0.5)" font-size="11" font-family="Noto Serif TC">海鮮</text>
        <text x="80" y="155" fill="rgba(240,192,96,0.5)" font-size="11" font-family="Noto Serif TC">家常菜</text>
        <text x="150" y="150" fill="rgba(255,96,160,0.5)" font-size="11" font-family="Noto Serif TC">異國料理</text>
      </svg>
      <p id="pend-result" style="text-align:center;color:var(--gold);font-size:14px;font-family:'Ma Shan Zheng',serif;min-height:24px;"></p>
      <p style="text-align:center;color:var(--text-dim);font-size:11px;">點擊啟動靈擺</p>
    </div>
  `;
  let running = false; let done = false;
  const svg = document.getElementById('pendulum-svg');
  const ball = document.getElementById('pend-ball');
  const sym = document.getElementById('pend-symbol');
  const CATEGORIES = ['海鮮料理','家常菜餚','異國料理'];
  svg.onclick = function() {
    if (running || done) return;
    running = true;
    const dur = 4000; const start = performance.now();
    const amplitude = 60;
    const pivot = {x:100, y:10};
    const length = 70;
    function frame(now) {
      const t = (now-start)/dur;
      if (t>=1) {
        // final position
        const finalAngle = (Math.random()-0.5)*0.6;
        const bx = pivot.x + Math.sin(finalAngle)*length;
        const by = pivot.y + Math.cos(finalAngle)*length;
        ball.setAttribute('cx', bx); ball.setAttribute('cy', by);
        sym.setAttribute('x', bx); sym.setAttribute('y', by+5);
        // Determine category
        const idx = bx < 90 ? 0 : bx > 115 ? 2 : 1;
        document.getElementById('pend-result').textContent = `靈擺指向：${CATEGORIES[idx]}`;
        modalState.category = CATEGORIES[idx];
        modalState.seed = Math.floor(Math.random()*9999);
        document.getElementById('modal-submit').disabled = false;
        running = false; done = true;
        return;
      }
      const decay = 1 - t;
      const angle = Math.sin(t*Math.PI*8) * amplitude * decay * (Math.PI/180);
      const bx = pivot.x + Math.sin(angle)*length;
      const by = pivot.y + Math.cos(angle)*length;
      ball.setAttribute('cx',bx); ball.setAttribute('cy',by);
      sym.setAttribute('x',bx); sym.setAttribute('y',by+5);
      const lineEl = document.querySelector('#pendulum-svg line');
      lineEl.setAttribute('x2',bx); lineEl.setAttribute('y2',by-14);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };
}

function submitModal() {
  const m = currentMethod;
  if (!m) return;
  let seed = modalState.seed || Math.floor(Math.random()*9999);
  let title = '今日三餐天機已定';
  let note = '命運如此，好好享用吧。';

  switch(m.type) {
    case 'zodiac': {
      const i = modalState.index || 0;
      seed = i * 100 + new Date().getDate();
      title = `${m.options[i]} 今日食運`;
      note = m.notes[i];
      break;
    }
    case 'shengxiao': {
      const i = modalState.index || 0;
      seed = i * 77 + new Date().getDate();
      title = `${m.options[i]} 今日食緣`;
      note = m.notes[i];
      break;
    }
    case 'bazi': {
      const i = modalState.index || 0;
      seed = i * 53 + new Date().getDate();
      title = `${m.options[i]}出生者今日食補`;
      note = m.notes[i];
      break;
    }
    case 'mbti': {
      const label = modalState.label || 'INTJ';
      seed = label.split('').reduce((a,c)=>a+c.charCodeAt(0),0) + new Date().getDate();
      title = `${label} 今日飲食密碼`;
      note = m.notes[label] || '今日飲食由人格引導。';
      break;
    }
    case 'tarot': {
      title = `塔羅命牌：${modalState.tarotName}`;
      note = modalState.tarotNote;
      break;
    }
    case 'dice': {
      title = `骰子總點數 ${modalState.seed} 的命運`;
      note = `宇宙透過骰子說話——點數 ${modalState.seed} 注定了你今日的食緣。`;
      break;
    }
    case 'wheel': {
      title = `命運之輪指向：${modalState.category}`;
      note = `轉盤從不說謊，今日你與「${modalState.category}」有不解之緣。`;
      break;
    }
    case 'sticks': {
      title = modalState.label || '籤詩天啟';
      note = modalState.note || '';
      break;
    }
    case 'crystal': {
      title = '水晶球感應結果';
      note = modalState.note || '';
      break;
    }
    case 'pendulum': {
      title = `靈擺指引：${modalState.category}`;
      note = `靈擺絕不欺騙潛意識，你內心早已知道今天想吃「${modalState.category}」。`;
      break;
    }
  }

  // Mark daily used — save result so it can be replayed
  if (m.daily) {
    usedDaily[m.id] = { title, note, seed };
    saveUsed();
    renderGrid();
  }

  closeModal();
  showResult(m, title, note, seed);
}
