<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世紀難題——吃什麼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700;900&family=Ma+Shan+Zheng&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f0c060;--gold-dim:#a07830;--teal:#40e0c0;--pink:#ff60a0;--purple:#9060e0;
  --bg-deep:#050810;--card-bg:rgba(255,255,255,0.04);--card-border:rgba(255,255,255,0.10);
  --text-main:#e8e0ff;--text-dim:#8880aa;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-deep);color:var(--text-main);font-family:'Noto Serif TC',serif;min-height:100vh;overflow-x:hidden;}
#stars-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.orbit-ring{position:fixed;top:50%;left:50%;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;border:1px solid rgba(240,192,96,0.03);animation:orbit 60s linear infinite;z-index:1;pointer-events:none;}
@keyframes orbit{to{transform:rotate(360deg);}}

/* ── Header ── */
header{position:relative;z-index:10;text-align:center;padding:60px 20px 20px;}
header .en-sub{font-family:'Cinzel Decorative',serif;font-size:11px;letter-spacing:6px;color:var(--gold-dim);text-transform:uppercase;margin-bottom:14px;}
header h1{font-family:'Ma Shan Zheng',serif;font-size:clamp(36px,8vw,80px);background:linear-gradient(135deg,var(--gold) 0%,#fff8e0 40%,var(--teal) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;}
header p.tagline{margin-top:14px;color:var(--text-dim);font-size:14px;letter-spacing:3px;}
.date-badge{display:inline-block;margin:10px auto 0;padding:4px 18px;border:1px solid var(--gold-dim);border-radius:20px;font-size:12px;color:var(--gold);letter-spacing:2px;}

/* ── Location bar ── */
#loc-bar{position:relative;z-index:10;text-align:center;padding:16px 20px 0;}
#loc-status{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:20px;font-size:12px;letter-spacing:1px;border:1px solid rgba(255,255,255,0.08);color:var(--text-dim);background:rgba(255,255,255,0.03);cursor:pointer;transition:all .25s;}
#loc-status:hover{border-color:rgba(64,224,192,0.4);color:var(--teal);}
#loc-status.ok{border-color:rgba(96,224,144,0.4);color:#60e090;cursor:default;}
#loc-status.err{border-color:rgba(224,96,96,0.4);color:#e09090;cursor:pointer;}
.loc-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* ── Result Panel ── */
#result-panel{display:none;position:relative;z-index:10;max-width:700px;margin:0 auto 10px;padding:0 20px;}
.result-card{background:linear-gradient(135deg,rgba(240,192,96,0.08),rgba(64,224,192,0.06));border:1px solid rgba(240,192,96,0.3);border-radius:20px;padding:30px;text-align:center;}
.result-method{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:8px;}
.result-title{font-family:'Ma Shan Zheng',serif;font-size:22px;color:#fff;margin-bottom:20px;}
.meals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.meal-item{background:rgba(255,255,255,0.05);border-radius:12px;padding:14px 10px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all .2s;}
.meal-item:hover{background:rgba(255,255,255,0.09);border-color:rgba(240,192,96,0.3);}
.meal-label{font-size:10px;letter-spacing:2px;color:var(--text-dim);margin-bottom:6px;}
.meal-name{font-size:16px;color:var(--gold);font-family:'Ma Shan Zheng',serif;line-height:1.3;}
.meal-sub{font-size:10px;color:var(--text-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.result-note{font-size:13px;color:var(--text-dim);line-height:1.8;font-style:italic;}
.result-loc-note{font-size:11px;color:rgba(96,224,144,0.7);margin-top:10px;letter-spacing:1px;}

/* ── Nearby list (under each meal) ── */
.meal-nearby{display:none;text-align:left;margin-top:8px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;}
.meal-item.expanded .meal-nearby{display:block;}
.nearby-mini{font-size:10px;color:var(--text-dim);padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;gap:6px;}
.nearby-mini:last-child{border-bottom:none;}
.nearby-mini a{color:var(--teal);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.nearby-mini a:hover{text-decoration:underline;}
.nearby-mini .ndist{color:var(--text-dim);flex-shrink:0;font-size:9px;}

/* ── Divider / section ── */
.mystic-divider{position:relative;z-index:10;text-align:center;color:var(--gold-dim);letter-spacing:8px;font-size:12px;margin:36px 0 24px;}
.section-label{position:relative;z-index:10;text-align:center;font-size:11px;letter-spacing:3px;color:var(--text-dim);margin-bottom:22px;}

/* ── Methods Grid ── */
.methods-grid{position:relative;z-index:10;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;max-width:900px;margin:0 auto;padding:0 20px;}
.method-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:22px 14px 18px;text-align:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;}
.method-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--accent-color,rgba(240,192,96,.15)),transparent 70%);opacity:0;transition:opacity .3s;}
.method-card:hover{transform:translateY(-4px) scale(1.03);border-color:var(--accent-color,var(--gold));box-shadow:0 12px 40px rgba(0,0,0,.4);}
.method-card:hover::before{opacity:1;}
.method-card .icon{font-size:36px;margin-bottom:10px;display:block;filter:drop-shadow(0 0 8px rgba(255,255,255,.2));}
.method-card .method-name{font-family:'Ma Shan Zheng',serif;font-size:16px;color:#fff;margin-bottom:4px;}
.method-card .method-desc{font-size:10px;color:var(--text-dim);letter-spacing:1px;line-height:1.5;}
.badge-daily{position:absolute;top:10px;right:10px;background:rgba(144,96,224,.3);border:1px solid rgba(144,96,224,.5);border-radius:6px;font-size:9px;padding:2px 6px;color:#c0a0ff;letter-spacing:1px;}
.badge-used{position:absolute;top:10px;right:10px;background:rgba(96,224,144,.15);border:1px solid rgba(96,224,144,.3);border-radius:6px;font-size:9px;padding:2px 6px;color:#80d0a0;}

/* ── Loading overlay ── */
#loading-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(5,8,16,.88);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#loading-overlay.show{display:flex;}
.loading-spinner{width:48px;height:48px;border:3px solid rgba(240,192,96,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
.loading-text{font-family:'Ma Shan Zheng',serif;font-size:20px;color:var(--gold);letter-spacing:4px;}
.loading-sub{font-size:12px;color:var(--text-dim);letter-spacing:2px;}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,8,16,.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:linear-gradient(160deg,#0d1530,#08101e);border:1px solid rgba(240,192,96,.2);border-radius:24px;padding:40px;max-width:480px;width:90%;position:relative;animation:modalIn .4s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto;}
@keyframes modalIn{from{transform:scale(.8) translateY(30px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;line-height:1;}
.modal-close:hover{color:#fff;}
.modal h2{font-family:'Ma Shan Zheng',serif;font-size:26px;margin-bottom:6px;color:var(--gold);text-align:center;}
.modal .modal-sub{text-align:center;font-size:12px;color:var(--text-dim);margin-bottom:28px;letter-spacing:2px;}
.modal-body{min-height:160px;}
.select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:20px;}
.select-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 4px;color:var(--text-main);font-size:13px;cursor:pointer;font-family:'Noto Serif TC',serif;transition:all .2s;text-align:center;}
.select-btn:hover,.select-btn.active{background:rgba(240,192,96,.15);border-color:var(--gold);color:var(--gold);}
#dice-face{font-size:90px;display:block;filter:drop-shadow(0 0 20px rgba(240,192,96,.4));cursor:pointer;}
#dice-display{text-align:center;padding:20px 0;}
#wheel-wrap{text-align:center;}
#wheel-canvas{border-radius:50%;margin:0 auto;display:block;}
#wheel-pointer{font-size:32px;line-height:1;margin:-16px auto 10px;filter:drop-shadow(0 0 6px rgba(255,96,160,.6));}
.tarot-cards{display:flex;gap:12px;justify-content:center;margin-bottom:16px;}
.tarot-card{width:70px;height:110px;background:linear-gradient(135deg,#1a0a30,#0d1540);border:2px solid rgba(144,96,224,.4);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px;transition:all .3s;position:relative;overflow:hidden;}
.tarot-card::before{content:'✦';position:absolute;font-size:60px;color:rgba(144,96,224,.1);}
.tarot-card:hover{transform:translateY(-8px);border-color:var(--purple);}
.tarot-card.flipped{background:linear-gradient(135deg,#2a1050,#1a2060);border-color:var(--gold);pointer-events:none;}
#sticks-wrap,#crystal-wrap,#pendulum-wrap{text-align:center;padding:10px 0;}
#stick-container{font-size:60px;margin:10px auto;filter:drop-shadow(0 0 12px rgba(240,192,96,.3));cursor:pointer;display:inline-block;transition:transform .15s;user-select:none;}
#stick-result{font-family:'Ma Shan Zheng',serif;font-size:18px;color:var(--gold);margin:10px 0;min-height:28px;}
#crystal-ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(64,224,192,.1) 40%,rgba(144,96,224,.05));border:2px solid rgba(64,224,192,.3);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(64,224,192,.6);cursor:pointer;box-shadow:0 0 40px rgba(64,224,192,.15),inset 0 0 30px rgba(144,96,224,.1);transition:all .4s;font-family:'Ma Shan Zheng',serif;user-select:none;}
.modal-submit{width:100%;padding:14px;background:linear-gradient(135deg,rgba(240,192,96,.2),rgba(64,224,192,.15));border:1px solid rgba(240,192,96,.4);border-radius:12px;color:var(--gold);font-family:'Ma Shan Zheng',serif;font-size:18px;letter-spacing:3px;cursor:pointer;transition:all .3s;margin-top:10px;}
.modal-submit:hover:not(:disabled){background:linear-gradient(135deg,rgba(240,192,96,.3),rgba(64,224,192,.25));box-shadow:0 0 20px rgba(240,192,96,.2);transform:translateY(-2px);}
.modal-submit:disabled{opacity:.4;cursor:not-allowed;}

.reset-btn{display:block;margin:0 auto 20px;background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 18px;color:var(--text-dim);font-size:11px;cursor:pointer;letter-spacing:2px;transition:all .2s;}
.reset-btn:hover{color:#fff;border-color:rgba(255,255,255,.3);}
footer{position:relative;z-index:10;text-align:center;padding:40px 20px;color:var(--text-dim);font-size:11px;letter-spacing:2px;}

@keyframes reveal{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.animate-in{animation:reveal .6s ease forwards;}
@keyframes spin{to{transform:rotate(360deg);}}
.shake{animation:shake .5s;}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
</style>
</head>
<body>
<canvas id="stars-canvas"></canvas>
<div class="orbit-ring"></div>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">天機運算中</div>
  <div class="loading-sub" id="loading-sub">正在感應附近食緣……</div>
</div>

<header>
  <div class="en-sub">The Century Dilemma</div>
  <h1>今天——吃什麼</h1>
  <p class="tagline">以玄學之名，解決人類最難的問題</p>
  <div class="date-badge" id="today-date"></div>
</header>

<div id="loc-bar">
  <div id="loc-status" onclick="requestLocation()">
    <span class="loc-dot"></span>
    <span id="loc-text">點此取得位置，獲得附近真實餐廳建議</span>
  </div>
</div>

<div id="result-panel">
  <div class="result-card animate-in">
    <div class="result-method" id="result-method-label">✦ 星座運勢占卜 ✦</div>
    <div class="result-title" id="result-title">今日三餐天機已定</div>
    <div class="meals-grid">
      <div class="meal-item" id="mi-breakfast" onclick="toggleMealDetail('breakfast')">
        <div class="meal-label">早 餐</div>
        <div class="meal-name" id="meal-breakfast">—</div>
        <div class="meal-sub" id="meal-breakfast-sub"></div>
        <div class="meal-nearby" id="meal-nearby-breakfast"></div>
      </div>
      <div class="meal-item" id="mi-lunch" onclick="toggleMealDetail('lunch')">
        <div class="meal-label">午 餐</div>
        <div class="meal-name" id="meal-lunch">—</div>
        <div class="meal-sub" id="meal-lunch-sub"></div>
        <div class="meal-nearby" id="meal-nearby-lunch"></div>
      </div>
      <div class="meal-item" id="mi-dinner" onclick="toggleMealDetail('dinner')">
        <div class="meal-label">晚 餐</div>
        <div class="meal-name" id="meal-dinner">—</div>
        <div class="meal-sub" id="meal-dinner-sub"></div>
        <div class="meal-nearby" id="meal-nearby-dinner"></div>
      </div>
    </div>
    <div class="result-note" id="result-note"></div>
    <div class="result-loc-note" id="result-loc-note"></div>
  </div>
</div>

<div class="mystic-divider">✦ 選擇你的占卜方式 ✦</div>
<div class="section-label">每日限定方式結果每天固定，可反覆查看</div>
<div class="methods-grid" id="methods-grid"></div>

<div style="position:relative;z-index:10;text-align:center;margin-top:28px;">
  <button class="reset-btn" onclick="devReset()">🔄 重置今日記錄（測試用）</button>
</div>

<footer>✦ 本站所有占卜結果純屬娛樂，如有雷同，實屬天意 ✦</footer>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 id="modal-title">占卜</h2>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-body" id="modal-body"></div>
    <button class="modal-submit" id="modal-submit" onclick="submitModal()">✦ 啟示命運 ✦</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// STARS
// ══════════════════════════════════════════════
(function(){
  const c=document.getElementById('stars-canvas'),ctx=c.getContext('2d');let s=[];
  function resize(){c.width=innerWidth;c.height=innerHeight;s=Array.from({length:200},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.3,a:Math.random(),da:(Math.random()-.5)*.005}));}
  function draw(){ctx.clearRect(0,0,c.width,c.height);s.forEach(p=>{p.a=Math.max(.1,Math.min(1,p.a+p.da));if(p.a<=.1||p.a>=1)p.da*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,240,${p.a})`;ctx.fill();});requestAnimationFrame(draw);}
  resize();draw();window.addEventListener('resize',resize);
})();

// ══════════════════════════════════════════════
// DATE
// ══════════════════════════════════════════════
(function(){
  const d=new Date();
  document.getElementById('today-date').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
})();

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const TODAY = new Date().toDateString();
let usedDaily = JSON.parse(localStorage.getItem('eatwhat_daily_'+TODAY)||'{}');
let currentMethod = null, modalState = {};
let userLat = null, userLon = null;
let nearbyRestaurants = []; // raw list from Overpass
let lastResult = null; // { method, title, note, picks }

function saveUsed(){ localStorage.setItem('eatwhat_daily_'+TODAY, JSON.stringify(usedDaily)); }
function devReset(){ localStorage.removeItem('eatwhat_daily_'+TODAY); usedDaily={}; renderGrid(); document.getElementById('result-panel').style.display='none'; }

// ══════════════════════════════════════════════
// LOCATION
// ══════════════════════════════════════════════
function requestLocation(){
  const el=document.getElementById('loc-status');
  const txt=document.getElementById('loc-text');
  if(el.classList.contains('ok')) return;
  txt.textContent='定位中…';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLat=pos.coords.latitude; userLon=pos.coords.longitude;
      el.classList.add('ok');
      txt.textContent=`已定位（${userLat.toFixed(3)}, ${userLon.toFixed(3)}）`;
      fetchNearbyRestaurants();
    },
    err=>{
      el.classList.add('err');
      txt.textContent='定位失敗，點此重試（結果將基於全球菜系）';
    },
    {timeout:10000}
  );
}

function haversine(la1,lo1,la2,lo2){
  const R=6371000,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
function fmtDist(m){ return m<1000?`${m}m`:`${(m/1000).toFixed(1)}km`; }

async function fetchNearbyRestaurants(){
  if(!userLat) return;
  try{
    const q=`[out:json][timeout:25];(node["amenity"="restaurant"](around:1500,${userLat},${userLon});node["amenity"="cafe"](around:1500,${userLat},${userLon});node["amenity"="fast_food"](around:1500,${userLat},${userLon});node["amenity"="food_court"](around:1500,${userLat},${userLon}););out body 120;`;
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q});
    const data=await res.json();
    nearbyRestaurants=(data.elements||[])
      .filter(p=>p.tags&&(p.tags.name||p.tags['name:zh']||p.tags['name:en']))
      .map(p=>({
        name: p.tags['name:zh']||p.tags['name:zh-Hant']||p.tags['name:zh-Hans']||p.tags.name||p.tags['name:en']||'',
        cuisine: p.tags.cuisine||p.tags.amenity||'',
        amenity: p.tags.amenity||'restaurant',
        dist: haversine(userLat,userLon,p.lat,p.lon),
        lat:p.lat, lon:p.lon,
      }))
      .filter(p=>p.name)
      .sort((a,b)=>a.dist-b.dist);
    const locNote=document.getElementById('result-loc-note');
    if(locNote&&nearbyRestaurants.length>0) locNote.textContent=`✓ 已從附近 ${nearbyRestaurants.length} 家餐廳中為你選定`;
  } catch(e){ /* silently fall back to generic */ }
}

// ══════════════════════════════════════════════
// SEEDED RANDOM
// ══════════════════════════════════════════════
function seededRand(seed){
  let x=Math.sin(seed+1)*10000; return x-Math.floor(x);
}
function seededPick(arr, seed){
  return arr[Math.floor(seededRand(seed)*arr.length)];
}

// ══════════════════════════════════════════════
// PICK MEALS — from real restaurants OR fallback
// ══════════════════════════════════════════════
// Fallback generic food names (global variety)
const FALLBACK = {

  lunch:['牛肉麵','雞腿便當','日式豚骨拉麵','韓式石鍋拌飯','越南河粉','泰式打拋豬飯','新加坡海南雞飯','印度奶油雞咖哩','義大利肉醬麵','西班牙海鮮燉飯','墨西哥塔可','英式魚薯條','滷肉飯','壽司拼盤','法式洋蔥湯套餐'],

function pickMeals(seed){
  if(nearbyRestaurants.length>=3){
    // Use seeded picks from real restaurant list — different offsets for each meal
    const total=nearbyRestaurants.length;
    const bi=Math.floor(seededRand(seed*7+1)*total);
    let li=Math.floor(seededRand(seed*13+3)*total);
    let di=Math.floor(seededRand(seed*17+7)*total);
    if(li===bi) li=(li+1)%total;
    if(di===bi||di===li) di=(di+2)%total;
    return {
      breakfast: nearbyRestaurants[bi],
      lunch:     nearbyRestaurants[li],
      dinner:    nearbyRestaurants[di],
      fromReal:  true,
    };
  }
  // fallback
  return {
    breakfast:{name:seededPick(FALLBACK.breakfast,seed*7+1),dist:null},
    lunch:    {name:seededPick(FALLBACK.lunch,seed*13+3),dist:null},
    dinner:   {name:seededPick(FALLBACK.dinner,seed*17+7),dist:null},
    fromReal: false,
  };
}

function showResult(method, title, note, seed){
  const picks=pickMeals(seed);
  lastResult={method,title,note,seed,picks};

  document.getElementById('result-method-label').textContent=`✦ ${method.name} ✦`;
  document.getElementById('result-title').textContent=title;

  ['breakfast','lunch','dinner'].forEach(meal=>{
    const p=picks[meal];
    document.getElementById(`meal-${meal}`).textContent=p.name;
    const sub=document.getElementById(`meal-${meal}-sub`);
    if(p.dist!==null) sub.textContent=`📍 ${fmtDist(p.dist)}`;
    else sub.textContent='';
    // Nearby alternatives panel
    const nb=document.getElementById(`meal-nearby-${meal}`);
    nb.innerHTML='';
    if(picks.fromReal && nearbyRestaurants.length>3){
      const others=nearbyRestaurants.filter(r=>r.name!==p.name).slice(0,4);
      nb.innerHTML='<div style="font-size:9px;color:var(--text-dim);margin-bottom:4px;letter-spacing:1px;">附近其他選擇</div>'+
        others.map(r=>`<div class="nearby-mini"><a href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lon}" target="_blank" rel="noopener">${r.name}</a><span class="ndist">${fmtDist(r.dist)}</span></div>`).join('');
    }
    document.getElementById(`mi-${meal}`).classList.remove('expanded');
  });

  document.getElementById('result-note').textContent=note;
  const locNote=document.getElementById('result-loc-note');
  if(picks.fromReal) locNote.textContent=`✓ 已從附近 ${nearbyRestaurants.length} 家餐廳中以天機選定`;
  else if(userLat) locNote.textContent='附近餐廳資料不足，顯示全球菜系建議';
  else locNote.textContent='尚未定位，顯示全球菜系建議 — 點上方定位可獲得附近餐廳';

  const panel=document.getElementById('result-panel');
  panel.style.display='block';
  panel.scrollIntoView({behavior:'smooth',block:'center'});
  const card=panel.querySelector('.result-card');
  card.classList.remove('animate-in'); void card.offsetWidth; card.classList.add('animate-in');
}

function toggleMealDetail(meal){
  const mi=document.getElementById(`mi-${meal}`);
  mi.classList.toggle('expanded');
}

    card.onclick=function(){if(card.classList.contains('flipped'))return;card.classList.add('flipped');card.innerHTML=`<span style="font-size:32px">${TAROT_EMO[ci]}</span><span style="font-size:10px;position:absolute;bottom:6px;color:var(--gold)">${TAROT_NAMES[ci]}</span>`;flipped++;if(flipped===1){modalState.tarotName=TAROT_NAMES[ci];modalState.tarotNote=TAROT_NOTES[TAROT_NAMES[ci]];modalState.seed=ci*17+Math.floor(Math.random()*100)+new Date().getDate();document.getElementById('tarot-hint').textContent=`✦ 你的命牌：${TAROT_NAMES[ci]} ✦`;document.getElementById('modal-submit').disabled=false;}};
    cardsEl.appendChild(card);
  });
}

// ── Sticks ──
const STICK_POEMS=[
  {num:'第一籤 上上',poem:'龍騰四海氣象新，今日口福自天來，山珍海味任君選，飽食一頓添福氣。',note:'上上籤！今日大吉，宜享用豐盛料理。'},
  {num:'第七籤 上吉',poem:'春風得意馬蹄疾，食緣正旺莫遲疑，清淡素雅養精神，一飲一食皆是福。',note:'上吉籤，今日宜選清爽健康的料理。'},
  {num:'第十二籤 中平',poem:'雲捲雲舒自在心，飲食隨緣最為真，不必強求珍饈味，家常便飯亦芳馨。',note:'中平籤，家常料理最為適宜，知足常樂。'},
  {num:'第廿三籤 中吉',poem:'金風玉露一相逢，今日食緣有奇緣，偶遇新店莫錯過，口齒留香記心間。',note:'中吉籤，今日適合嘗試新餐廳，有驚喜。'},
  {num:'第卅一籤 下下',poem:'霧裡看花終隔山，今日食欲不甚佳，宜食清淡養腸胃，明日必有好時光。',note:'下下籤，今日腸胃需休養，選清淡易消化食物。'},
  {num:'第四十籤 上上',poem:'鳳凰來儀百鳥朝，今日口福冠諸天，但凡所食皆美味，此生食緣屬今天。',note:'上上籤大吉！今天吃什麼都好吃，放心選你最想吃的！'},
];
function renderSticksModal(){
  document.getElementById('modal-body').innerHTML=`<div id="sticks-wrap"><p style="color:var(--text-dim);font-size:13px;margin-bottom:8px;">虔心默想「我今天該吃什麼」<br>搖動籤筒三次</p><div id="stick-container">🏺</div><div id="stick-result"></div><div id="stick-poem" style="font-size:12px;color:var(--text-dim);line-height:1.8;text-align:center;"></div><div id="stick-count" style="font-size:11px;color:var(--gold);margin-top:6px;"></div></div>`;
  let shakes=0;
  document.getElementById('stick-container').onclick=function(){
    if(shakes>=3)return;
    this.classList.remove('shake');void this.offsetWidth;this.classList.add('shake');shakes++;
    document.getElementById('stick-count').textContent=`已搖 ${shakes}/3 次`;
    if(shakes===3){const c=STICK_POEMS[Math.floor(Math.random()*STICK_POEMS.length)];document.getElementById('stick-result').textContent=c.num;document.getElementById('stick-poem').textContent=c.poem;modalState.note=c.note;modalState.label=c.num;modalState.seed=Math.floor(Math.random()*9999)*41+new Date().getDate();document.getElementById('modal-submit').disabled=false;this.style.cursor='default';}
  };
}

// ── Crystal ──
const CRYSTAL_MSGS=['水晶感應到你今日需要大量能量補充……','靈光顯現——暖色調食材是今日所需……','翠綠光芒浮現，清爽料理是今日答案……','深紫光芒閃現，神秘料理正等待你……','水晶微微發熱，今日宜食溫補之物……','冰藍光暈——海洋之物與你今日緣分深厚……'];
function renderCrystalModal(){
  document.getElementById('modal-body').innerHTML=`<div id="crystal-wrap"><div id="crystal-ball">凝視<br>水晶球</div><div id="crystal-msg" style="font-size:12px;color:var(--text-dim);text-align:center;min-height:40px;line-height:1.8;margin-top:8px;font-style:italic;"></div></div>`;
  let gazed=0;
  document.getElementById('crystal-ball').onclick=function(){
    gazed++;const msg=CRYSTAL_MSGS[Math.floor(Math.random()*CRYSTAL_MSGS.length)];
    document.getElementById('crystal-msg').textContent=msg;
    this.style.boxShadow=`0 0 ${30+gazed*20}px rgba(64,224,192,${.2+gazed*.15}),inset 0 0 ${20+gazed*15}px rgba(144,96,224,${.1+gazed*.1})`;
    if(gazed>=3){this.textContent='✦';this.style.color='var(--gold)';modalState.note=msg+'你的潛意識已知曉答案。';modalState.seed=Math.floor(Math.random()*9999)*43+new Date().getDate();document.getElementById('modal-submit').disabled=false;this.onclick=null;}
  };
}

// ── Pendulum ──
function renderPendulumModal(){
  document.getElementById('modal-body').innerHTML=`<div id="pendulum-wrap"><p style="color:var(--text-dim);font-size:12px;text-align:center;margin-bottom:8px;">靜心觀察靈擺方向，感應今日食緣</p><svg id="pendulum-svg" width="200" height="160" viewBox="0 0 200 160"><line x1="100" y1="10" x2="100" y2="70" stroke="rgba(240,192,96,.4)" stroke-width="1"/><circle id="pend-ball" cx="100" cy="80" r="14" fill="none" stroke="var(--gold)" stroke-width="2"/><text id="pend-sym" x="100" y="85" text-anchor="middle" fill="var(--gold)" font-size="14" font-family="serif">◈</text><text x="12" y="150" fill="rgba(64,224,192,.5)" font-size="11" font-family="Noto Serif TC">海鮮</text><text x="75" y="155" fill="rgba(240,192,96,.5)" font-size="11" font-family="Noto Serif TC">家常菜</text><text x="148" y="150" fill="rgba(255,96,160,.5)" font-size="11" font-family="Noto Serif TC">異國料理</text></svg><p id="pend-result" style="text-align:center;color:var(--gold);font-size:14px;font-family:'Ma Shan Zheng',serif;min-height:24px;"></p><p style="text-align:center;color:var(--text-dim);font-size:11px;">點擊啟動靈擺</p></div>`;
  let running=false,done=false;
  document.getElementById('pendulum-svg').onclick=function(){
    if(running||done)return;running=true;
    const CATS=['海鮮料理','家常菜餚','異國料理'],pivot={x:100,y:10},len=70,dur=4000,start=performance.now();
    function frame(now){const t=(now-start)/dur;if(t>=1){const fa=(Math.random()-.5)*.6,bx=pivot.x+Math.sin(fa)*len,by=pivot.y+Math.cos(fa)*len;document.getElementById('pend-ball').setAttribute('cx',bx);document.getElementById('pend-ball').setAttribute('cy',by);document.getElementById('pend-sym').setAttribute('x',bx);document.getElementById('pend-sym').setAttribute('y',by+5);const idx=bx<90?0:bx>115?2:1;document.getElementById('pend-result').textContent=`靈擺指向：${CATS[idx]}`;modalState.category=CATS[idx];modalState.seed=Math.floor(Math.random()*9999)*47+new Date().getDate();document.getElementById('modal-submit').disabled=false;running=false;done=true;return;}const decay=1-t,angle=Math.sin(t*Math.PI*8)*60*decay*(Math.PI/180),bx=pivot.x+Math.sin(angle)*len,by=pivot.y+Math.cos(angle)*len;document.getElementById('pend-ball').setAttribute('cx',bx);document.getElementById('pend-ball').setAttribute('cy',by);document.getElementById('pend-sym').setAttribute('x',bx);document.getElementById('pend-sym').setAttribute('y',by+5);const ln=document.querySelector('#pendulum-svg line');ln.setAttribute('x2',bx);ln.setAttribute('y2',by-14);requestAnimationFrame(frame);}
    requestAnimationFrame(frame);
  };
}

// ══════════════════════════════════════════════
// SUBMIT MODAL
// ══════════════════════════════════════════════
async function submitModal(){
  const m=currentMethod; if(!m)return;
  closeModal();

  // Show loading overlay while we potentially fetch restaurants
  showLoading('天機運算中','正在感應附近食緣……');
  // Ensure restaurants fetched if we have location
  if(userLat&&nearbyRestaurants.length===0) await fetchNearbyRestaurants();

  let seed=modalState.seed||Math.floor(Math.random()*9999),title='今日三餐天機已定',note='命運如此，好好享用吧。';
  const d=new Date().getDate();
  switch(m.type){
    case 'zodiac':{const i=modalState.index||0;seed=(i*100+d)*7;title=`${m.options[i]} 今日食運`;note=m.notes[i];break;}
    case 'shengxiao':{const i=modalState.index||0;seed=(i*77+d)*11;title=`${m.options[i]} 今日食緣`;note=m.notes[i];break;}
    case 'bazi':{const i=modalState.index||0;seed=(i*53+d)*13;title=`${m.options[i]}出生者今日食補`;note=m.notes[i];break;}
    case 'mbti':{const lb=modalState.label||'INTJ';seed=(lb.split('').reduce((a,c)=>a+c.charCodeAt(0),0)+d)*17;title=`${lb} 今日飲食密碼`;note=m.notes[lb]||'今日飲食由人格引導。';break;}
    case 'tarot':{title=`塔羅命牌：${modalState.tarotName}`;note=modalState.tarotNote;break;}
    case 'dice':{title=`點數 ${modalState.seed%100} 的命運`;note=`宇宙透過骰子說話，今日食緣已定。`;break;}
    case 'wheel':{title=`命運之輪：${modalState.category}`;note=`轉盤從不說謊，今日你與「${modalState.category}」有不解之緣。`;break;}
    case 'sticks':{title=modalState.label||'籤詩天啟';note=modalState.note||'';break;}
    case 'crystal':{title='水晶球感應結果';note=modalState.note||'';break;}
    case 'pendulum':{title=`靈擺指引：${modalState.category}`;note=`靈擺不欺潛意識，你內心已知今日想吃「${modalState.category}」。`;break;}
  }

  if(m.daily){usedDaily[m.id]={title,note,seed};saveUsed();renderGrid();}
  hideLoading();
  showResult(m,title,note,seed);
}

function showLoading(t,s){
  document.getElementById('loading-text').textContent=t;
  document.getElementById('loading-sub').textContent=s;
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading(){ document.getElementById('loading-overlay').classList.remove('show'); }

</script>
